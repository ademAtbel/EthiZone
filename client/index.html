<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EthiZone | Direct-Connect Local Marketplace & Directory</title>
    <meta name="description" content="EthiZone connects customers directly with stores, handymen, tax advisors, legal services, real estate, vehicles, and freelancers with zero middle-man fees." />
    <meta name="keywords" content="EthiZone, marketplace, stores, services, handymen, real estate, vehicles, freelancers, local business directory" />
    <link rel="canonical" href="https://ethizone.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ethizone.com/" />
    <meta property="og:title" content="EthiZone | Direct-Connect Marketplace & Directory" />
    <meta property="og:description" content="Connect directly with stores, handymen, clinics, law offices, and local services." />
    <meta property="og:image" content="https://ethizone.com/hero_monitor.png" />

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://ethizone.com/" />
    <meta property="twitter:title" content="EthiZone | Direct-Connect Marketplace & Directory" />
    <meta property="twitter:description" content="Connect directly with stores, handymen, clinics, law offices, and local services." />
    <meta property="twitter:image" content="https://ethizone.com/hero_monitor.png" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Google Fonts Inter & Outfit & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              surface: 'var(--surface, #ffffff)',
              on_surface: 'var(--on-surface, #0f172a)',
              on_surface_variant: 'var(--on-surface-variant, #64748b)',
              surface_container_lowest: 'var(--surface-container-lowest, #ffffff)',
              surface_container_low: 'var(--surface-container-low, #f8fafc)',
              surface_container_high: 'var(--surface-container-high, #f1f5f9)',
              surface_container_highest: 'var(--surface-container-highest, #e2e8f0)',
              outline_variant: 'var(--outline-variant, #cbd5e1)',
              primary: 'var(--primary-color, #0d5c3a)',
              on_primary: 'var(--on-primary, #ffffff)',
              primary_container: 'var(--primary-container, #dcfce7)',
              on_primary_container: 'var(--on-primary-container, #14532d)',
              secondary_container: 'var(--secondary-container, #fef3c7)',
              on_secondary_container: 'var(--on-secondary-container, #92400e)',
              error: 'var(--error-color, #ef4444)',
              error_container: 'var(--error-container, #fee2e2)',
              on_error_container: 'var(--on-error-container, #991b1b)'
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
